name: Update market vegetable prices
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: market-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_market_prices.py
      - name: Save verified data and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh vegetable prices from Srimuang report'
            git pull --rebase
            git push
            gh api --method POST repos/${{ github.repository }}/pages/builds
          fi
